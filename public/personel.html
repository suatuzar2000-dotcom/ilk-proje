<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Yabancı Oturum Bilgi Formu - Adım 2</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="loading-overlay hidden" id="loadingEl">
    <div class="spinner"></div>
    <p id="loadingMsg">Gönderiliyor...</p>
  </div>

  <header class="hdr">
    <div class="hdr-geo"></div>
    <div class="hdr-geo2"></div>
    <div class="hdr-inner">
      <div class="hdr-text">
        <h1>Yabancı Oturum <span>Bilgi Formu</span></h1>
        <p>(Ülke Resmi İşler Personelleri Tarafından Doldurulmalıdır)</p>
      </div>
      
      <div style="margin-left: auto;" class="no-print">
        <select id="langSwitcher" onchange="if(typeof setLanguage === 'function') { setLanguage(this.value); if(typeof switchR === 'function' && document.querySelector('.rt.active')) { document.querySelector('.rt.active').click(); } }" style="padding: 5px; border-radius: 4px; border: 1px solid var(--line); font-size: 13px; background: var(--white);">
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="en">🇬🇧 English</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fr">🇫🇷 Français</option>
        </select>
      </div>

      <div class="hdr-pill no-print">
        <div class="pill">Kurum İçi</div>
      </div>
    </div>
  </header>

  <div class="prog-bar no-print">
    <div class="prog-inner">
      <div class="ps done" id="st1" onclick="goPage('index.html')" style="cursor:pointer" title="Ülke Seçimine Dön">
        <div class="n">1</div>Ülke Seç
      </div>
      <div class="ps active" id="st2" onclick="goPage('personel.html')" style="cursor:pointer">
        <div class="n">2</div>Personel
      </div>
      <div class="ps" id="st3" onclick="goPage('oturum.html')" style="cursor:pointer">
        <div class="n">3</div>Oturum Türleri
      </div>
      <div class="ps" id="st4" onclick="goPage('gonder.html')" style="cursor:pointer">
        <div class="n">4</div>Notlar &amp; Gönder
      </div>
    </div>
  </div>

  <div class="main">
    <div class="pg" id="p2">
      <div class="card">
        <div class="card-hd">
          <div class="card-hd-txt">
            <h2>Personel bilgileri</h2>
            <p>Formu dolduran kişinin iletişim bilgileri</p>
          </div>
        </div>
        <div class="card-bd">
          <div class="fg g2">
            <div class="field"><label>Ad Soyad *</label><input type="text" id="pName" placeholder="Tam adınız" />
              <div class="val-msg">Bu alan zorunludur.</div>
            </div>
          </div>
          <div class="fg g3">
            <div class="field"><label>E-posta *</label><input type="email" id="pEmail"
                placeholder="ornek@kurum.org" />
              <div class="val-msg">Geçerli bir e-posta giriniz.</div>
            </div>
            <div class="field"><label>Telefon</label><input type="text" id="pPhone" placeholder="+966 5xx xxx xxxx" />
            </div>
            <div class="field"><label>Rapor tarihi</label><input type="date" id="pDate" /></div>
          </div>
          <div class="fg g2">
            <div class="field"><label>Kurum / Ofis</label><input type="text" id="pOrg"
                placeholder="Vazifeli olduğu kurumun adı" /></div>
            <div class="field"><label>Ülkedeki görev süresi</label><input type="text" id="pDuration"
                placeholder="örn. 2 yıl 4 ay" /></div>
          </div>
        </div>
      </div>
      <div class="bbar between">
        <button class="btn btn-ghost" onclick="goPage('index.html')">← Geri</button>
        <button class="btn btn-navy" onclick="goPage('oturum.html')">Oturum Türleri →</button>
      </div>
    </div>

    <script src="js/lang.js"></script>
  <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
